<mat-card class="sc-card">
    <mat-card-header>
    <mat-card-title>
        Failed to process payment details
    </mat-card-title>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content>
        <mat-list>
            <mat-list-item>
                <mat-icon matListItemIcon>mail</mat-icon>
                Failed to process payment details. Please try another payment method.
            </mat-list-item>
            <mat-list-item>
                <mat-icon matListItemIcon>dashboard</mat-icon>
                You can manage your Subscription in your Dashboard.
            </mat-list-item>
        </mat-list>
    </mat-card-content>
    <mat-card-actions>
        <button (click)="openChangePayment()" mat-stroked-button color="primary">Dashboard</button>
    </mat-card-actions>
</mat-card>
