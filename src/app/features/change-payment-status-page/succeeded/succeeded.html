<mat-card class="sc-card">
    <mat-card-header>
    <mat-card-title>
        Success
    </mat-card-title>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content>
        <mat-list>
            <mat-list-item>
                <mat-icon matListItemIcon>credit_card</mat-icon>
                Your payment method has been saved.
            </mat-list-item>
            <mat-list-item>
                <mat-icon matListItemIcon>dashboard</mat-icon>
                You can manage your Subscription in your Dashboard.
            </mat-list-item>
        </mat-list>
    </mat-card-content>
    <mat-card-actions>
        <button (click)="openReturnUrl()" mat-stroked-button color="primary">Return</button>
    </mat-card-actions>
</mat-card>
