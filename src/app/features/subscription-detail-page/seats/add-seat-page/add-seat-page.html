<mat-card class="sc-card">
  <mat-card-header>
  <mat-card-title>Invite user</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-form-field appearance="fill">
      <mat-label>E-Mail</mat-label>
      <input
        type="email"
        matInput
        id="invite-email"
        aria-label="E-Mail"
        placeholder="name@example.com"
        [formControl]="email"
        required
      />
      @if (email.invalid && email.touched) {
        <mat-error>{{ getEmailErrorMessage() }}</mat-error>
      }
    </mat-form-field>

    <h3 id="invite-roles-label" class="role-list-heading">Select roles</h3>
    <mat-chip-listbox
      multiple
      aria-labelledby="invite-roles-label"
      class="mat-mdc-chip-set-stacked role-list"
    >
      @for (role of inviteUserRoles; track role) {
        <mat-chip-option
          [selected]="selectedRoles().includes(role)"
          (click)="toggleRoleSelection(role)"
          (keydown)="handleKeyDown($event, role)"
          [matTooltip]="roleDescriptions[role]"
        >
          {{ role }}
        </mat-chip-option>
      }
    </mat-chip-listbox>
  </mat-card-content>
  <mat-card-actions>
    <button
      mat-stroked-button 
      (click)="addSeat()"
      [disabled]="isSubmitting()"
      aria-label="Send invitation"
    >
      @if (isSubmitting()) {
        <mat-spinner diameter="18" />
      } @else {
        Invite
      }
    </button>
  </mat-card-actions>
</mat-card>
