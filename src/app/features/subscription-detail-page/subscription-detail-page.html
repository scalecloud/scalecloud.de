<mat-tab-group animationDuration="0ms" class="subscription-tabs">
    <mat-tab label="Overview">
        <ng-template matTabContent>
            <div class="flex-container">
                <div class="flex-item">
                    <app-subscription-detail-card></app-subscription-detail-card>
                </div>
            </div>
        </ng-template>
    </mat-tab>
    <mat-tab label="Users &amp; Spaces">
        <ng-template matTabContent>
            <div class="flex-container">
                <div class="flex-item">
                    <app-seats></app-seats>
                </div>
            </div>
        </ng-template>
    </mat-tab>
    <mat-tab label="Billing">
        <ng-template matTabContent>
            <div class="flex-container">
                <div class="flex-item">
                    <app-payment-method-overview></app-payment-method-overview>
                </div>
                <div class="flex-item">
                    <app-billing-address-overview></app-billing-address-overview>
                </div>
                <div class="flex-item">
                    <app-invoices></app-invoices>
                </div>
                <div class="flex-item">
                    <app-billing-portal></app-billing-portal>
                </div>
            </div>
        </ng-template>
    </mat-tab>
</mat-tab-group>
