<mat-toolbar color="primary">
  <mat-toolbar-row>
    <button mat-icon-button (click)="toggleSideBar()">
      <mat-icon>menu</mat-icon>
    </button>
    <button mat-button routerLink="/">
      <img class="logo-icon" src="img/logo/logo-white-48.png" alt="ScaleCloud.de">
      ScaleCloud.de
    </button>
    <span class="fill-remaining-space"></span>
    @if (auth.resolved()) {
      @if (auth.showAsLoggedIn()) {
        <div>
          <button mat-button routerLink="/dashboard">
            <mat-icon>dashboard</mat-icon>
            Dashboard
          </button>
          <button mat-button [matMenuTriggerFor]="menu" aria-label="Account menu">
            <mat-icon>person</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              Logout
            </button>
          </mat-menu>
        </div>
      } @else {
        <div>
          <button mat-button (click)="login()">
            <mat-icon>login</mat-icon>
            Login
          </button>
          <button mat-stroked-button class="signup-button" (click)="register()">
            Sign up
          </button>
        </div>
      }
    }
  </mat-toolbar-row>
</mat-toolbar>
