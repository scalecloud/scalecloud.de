<mat-toolbar color="primary">
  <mat-toolbar-row>
    <button mat-icon-button (click)="toggleSideBar()">
      <mat-icon>menu</mat-icon>
    </button>
    <button mat-button routerLink="/">
      <img class="logo-icon" src="img/logo/logo-white-48.png" alt="ScaleCloud.de">
      ScaleCloud.de
    </button>
    <span class="fill-remaining-space"></span>
    @if (auth.resolved()) {
      @if (auth.showAsLoggedIn()) {
        <div>
          <button mat-button routerLink="/dashboard">
            <mat-icon>dashboard</mat-icon>
            Dashboard
          </button>
          <button mat-button [matMenuTriggerFor]="menu">
            @if (accountInitials; as initials) {
              <span class="account-avatar">{{ initials }}</span>
            } @else {
              <mat-icon>person</mat-icon>
            }
          </button>
          <mat-menu #menu="matMenu">
            @if (auth.user(); as user) {
              <button mat-menu-item class="account-menu-identity" disabled>
                <mat-icon>person</mat-icon>
                <span>{{ user.email ?? user.displayName ?? 'Account' }}</span>
              </button>
            }
            <a mat-menu-item [href]="accountSettingsUrl" target="_blank" rel="noopener noreferrer">
              <mat-icon>security</mat-icon>
              <span>Passkeys &amp; MFA</span>
            </a>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              Logout
            </button>
          </mat-menu>
        </div>
      } @else {
        <div>
          <button mat-button (click)="login()">
            <mat-icon>login</mat-icon>
            Login
          </button>
        </div>
      }
    }
  </mat-toolbar-row>
</mat-toolbar>
